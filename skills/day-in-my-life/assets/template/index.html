<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- the caption and lettering face (Gochi Hand, SIL OFL), fetched from Google Fonts at preview and render time -->
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=block" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #eee9e0; }
      #root { width: 100%; height: 100%; position: relative; background: #eee9e0; }
      /* the kit paints in a hidden p5/WEBGL canvas and composites each drawing into #out */
      #out { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .p5Canvas { display: none !important; }
    </style>
    <script src="vendor/p5.min.js"></script>
    <script src="vendor/p5.brush.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-fps="24" data-no-timeline data-width="1920" data-height="1080">
      <canvas id="out" width="1920" height="1080"></canvas>
      <!-- the string score and the keystroke clicks, both written by scripts/score.py on the film clock -->
      <audio id="score" src="music/strings-mix.wav" data-start="0" data-duration="__DURATION__" data-track-index="1" data-volume="1"></audio>
      <audio id="keys" src="music/keys.wav" data-start="0" data-duration="__DURATION__" data-track-index="2" data-volume="0.7"></audio>
    </div>
    <script src="kit/brush-ink.js"></script>
    <script src="kit/props.js"></script>
    <script src="kit/film.js"></script>
    <script src="kit/hf-bridge.js"></script>
    <script src="story.js"></script>
    <script src="scenes.js"></script>
  </body>
</html>
